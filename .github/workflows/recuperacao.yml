# Verifica a cada 5 minutos se algum PIX completou 1h sem pagamento e manda a notificação.
# (O agendador do GitHub às vezes atrasa alguns minutos; é normal.)
name: Aviso de recuperação de PIX
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl -fsS --max-time 60 "https://kamify-rastreador.vercel.app/api/recuperacao/verificar"
